# ============================================================
# RecoverFlow AI — Docker Compose
# ============================================================
#
# Usage:
#   docker compose up --build          # build + start all
#   docker compose up -d               # start detached
#   docker compose down                # stop + remove containers
#   docker compose down -v             # also removes volumes
#   docker compose logs -f             # tail all logs
#   docker compose logs -f backend     # tail backend only
#   docker compose ps                  # check container status
#
# Services:
#   frontend  → http://localhost:5173
#   backend   → http://localhost:8000  (Swagger: /docs)
#   mongodb   → localhost:27017
#
# Environment:
#   Copy backend/.env.example to backend/.env and fill in credentials.
#   NEVER commit backend/.env.
# ============================================================

services:

  # ── MongoDB ─────────────────────────────────────────────────
  mongodb:
    image: mongo:8.0
    container_name: recoverflow_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: recoverflow
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FastAPI Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recoverflow_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      # backend/.env is gitignored — never committed
      - ./backend/.env
    environment:
      # Override MONGODB_URI to use the Docker service name, not localhost
      MONGODB_URI: mongodb://mongodb:27017/recoverflow
      # Override FRONTEND_URL for Docker CORS
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── React/Vite Frontend ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recoverflow_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Proxy target: in Docker, frontend container proxies API calls to backend container
      VITE_PROXY_TARGET: http://backend:8000
      # Browser-visible API URL: always localhost from the user's browser
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      backend:
        condition: service_healthy

# ── Persistent Volumes ─────────────────────────────────────────
volumes:
  mongodb_data:
    name: recoverflow_mongodb_data
